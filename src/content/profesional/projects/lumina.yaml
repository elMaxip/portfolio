order: 1
name: Lumina
summary: Inventario y caja para almacenes
problem: "Los almacenes de barrio llevan el stock en cuadernos: no saben qué vence primero ni cuánto venden."
solution: Un inventario por lotes y un punto de venta con lector de códigos, que vende primero lo que vence antes.
note: Código privado. Las capturas usan datos de demostración.
technologies: [Angular, TypeScript, NgRx Signals, Spring Boot, Java, PostgreSQL, Docker]
# También cuentan en el Stack
alsoUses: [HTML, CSS, Git, Figma]
links:
  - label: Probar la demo
    href: https://lumina-c6p.pages.dev/
screenshotBackground: "#0a1014"
screenshots:
  - label: Inventario
    alt: Inventario de Lumina con catorce productos, sus precios, descuentos y stock, y avisos de cuatro productos por caducar y dos con poco stock
    image: ../../../assets/projects/lumina/inventory.png
    description: Productos con sus lotes, filtros y avisos de lo que está por vencer o tiene poco stock. Al entrar se descarga el inventario completo y después solo los cambios desde la última sincronización, con la hora del servidor para no depender de relojes desfasados. Los borrados son lógicos, para que también lleguen en esa sincronización.
  - label: Punto de venta
    alt: Punto de venta de Lumina con una venta de nueve productos en curso, varios con descuento
    image: ../../../assets/projects/lumina/pos.png
    description: El carrito se llena con una pistola lectora, la cámara o el código a mano. La pistola funciona como un teclado, así que se puede escanear sin enfocar ningún campo. Al confirmar, el backend descuenta el stock desde los lotes que vencen primero (FEFO), y los montos se manejan con BigDecimal, nunca con decimales flotantes.
  - label: Estadísticas
    alt: Panel de Lumina con las ventas del día, las ventas de cada mes comparadas con el año anterior y las ventas de la semana
    image: ../../../assets/projects/lumina/statistics.png
    description: "Ganancias del día y del mes, ranking de productos e historial de ventas paginado. Cada venta actualiza contadores pre-agregados: registrar una venta cuesta un poco más, pero el panel carga sin recorrer todas las ventas."
