order: 3
name: MiHorario
summary: Horarios armados desde un Excel
problem: Armar un horario era probar combinaciones a mano en una planilla de miles de filas.
solution: Subes la planilla, eliges ramos y horas, y genera todos los horarios posibles sin topes.
