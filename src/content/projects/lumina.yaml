name: Lumina
summary: Inventario y caja para almacenes
problem: "Los almacenes de barrio llevan el stock en cuadernos: no saben qué vence primero ni cuánto venden."
solution: Un inventario por lotes y un punto de venta con lector de códigos, que vende primero lo que vence antes.
